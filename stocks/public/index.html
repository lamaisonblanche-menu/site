<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stocks — La Maison Blanche</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="hidden">
  <div class="login-card">
    <img src="logo.png" alt="La Maison Blanche">
    <div class="kick">Gestion des stocks</div>
    <form id="loginForm" autocomplete="on">
      <label class="f">Identifiant<input id="lgUser" autocomplete="username" required autofocus></label>
      <label class="f">Mot de passe<input id="lgPass" type="password" autocomplete="current-password" required></label>
      <div class="login-err" id="lgErr"></div>
      <button class="btn dark lg" type="submit">Se connecter</button>
    </form>
  </div>
</div>
<div id="shell" class="hidden">
  <aside id="rail">
    <div class="brand"><img src="logo-blanc.png" alt="La Maison Blanche"><div>Stocks &amp; achats</div></div>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main id="main">
    <div id="offline" class="hidden">Pas de connexion au serveur SRV MB — réceptions et sorties restent possibles : elles sont gardées sur ce PC et envoyées automatiquement au retour du Wi-Fi.</div>
    <header id="top"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div id="topActions" class="row"></div><div id="netstate"><i></i><span>Connecté</span></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="modals"></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
