<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Maison Blanche — Stocks</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#302c27;background:#f7f4ef}*{box-sizing:border-box}body{margin:0}header{background:#222923;color:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}header small{letter-spacing:2px;color:#d7c9a8}main{max-width:1100px;margin:auto;padding:24px}h1{font-family:Georgia,serif;font-weight:400;margin:5px 0 20px}h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #e4dfd6;border-radius:12px;padding:20px;margin-bottom:16px}.stat{font-size:26px;font-weight:650}label{display:block;font-size:12px;color:#6e675c;margin-bottom:5px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #d5d0c7;max-width:100%}input,select{width:100%;background:white;margin-bottom:10px}button{background:#29382e;color:white;border:0;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#eeeae2;color:#2c332c}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid #eee}th{color:#6e675c}#notice{min-height:25px;color:#8b3c30}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:#e8e3d9;color:#2c332c}.tabs button.active{background:#29382e;color:white}.hidden{display:none}.muted{color:#777;font-size:12px}.line{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.wide{overflow:auto}</style></head><body>
<header><div><small>LA MAISON BLANCHE</small><div style="font-family:Georgia,serif;font-size:23px">Gestion des stocks</div></div><div id="who"></div></header>
<main><section id="login" class="card" style="max-width:420px;margin:55px auto"><h1>Connexion</h1><label>Identifiant</label><input id="username" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Se connecter</button><p class="muted">Prototype de développement — non destiné à la production.</p></section>
<section id="app" class="hidden"><h1>Tableau de bord</h1><div id="notice"></div><div class="tabs" id="tabs"></div><div id="view"></div></section></main>
<script>
let token='',state=null,tab='dashboard';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x||0).toLocaleString('fr-FR')+' DA';
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.erreur||'Erreur');return j}
async function login(){try{let r=await api('login',{username:$('username').value,password:$('password').value});token=r.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){alert(e.message)}}
async function refresh(){try{state=await api('state');$('who').textContent=state.user.username+' · '+state.user.role;render()}catch(e){$('notice').textContent=e.message}}
async function post(path,data){try{await api(path,data);$('notice').textContent='Opération enregistrée';await refresh()}catch(e){$('notice').textContent=e.message}}
const val=id=>$(id).value;const num=id=>Number(val(id));
const sel=(arr,id,name)=>'<select id="'+id+'">'+arr.map(x=>'<option value="'+x.id+'">'+esc(x[name])+'</option>').join('')+'</select>';
function form(title,body,action){return '<div class="card"><h2>'+title+'</h2>'+body+'<button onclick="'+action+'">Enregistrer</button></div>'}
function table(headers,rows){return '<div class="card wide"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){
const role=state.user.role;let tabs=['dashboard','achats','sorties','factures','demandes'];$('tabs').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+({dashboard:'Vue générale',achats:'Réceptions',sorties:'Sorties',factures:'Factures',demandes:'Paiements'}[t])+'</button>').join('');
let v='';
if(tab==='dashboard'){let due=state.invoices.reduce((s,x)=>s+x.due,0);v='<div class="grid">'+[['Articles',state.items.length],['Stock (références)',state.items.filter(x=>x.stock>0).length],['Dettes fournisseurs',money(due)],['Demandes à traiter',state.requests.filter(x=>x.status==='soumise').length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('')+'</div>'+table(['Article','Unité','Stock'],state.items.map(x=>[esc(x.name),esc(x.unit),esc(x.stock)]))}
if(tab==='achats'){v=form('Ajouter un fournisseur','<label>Nom</label><input id="supplierName">',"post('supplier',{name:val('supplierName')})")+form('Créer un article','<label>Désignation</label><input id="itemName"><label>Unité (kg, L, pièce)</label><input id="unitName">',"post('item',{name:val('itemName'),unit:val('unitName')})")+form('Réception de marchandises','<label>Fournisseur</label>'+sel(state.suppliers,'rs','name')+'<label>Référence du bon</label><input id="rr"><label>Article</label>'+sel(state.items,'ri','name')+'<label>Quantité</label><input id="rq" type="number" min=".001" step=".001"><label>Coût unitaire (DA)</label><input id="rc" type="number" min="0">',"post('receipt',{supplier_id:num('rs'),reference:val('rr'),lines:[{item_id:num('ri'),quantity:num('rq'),unit_cost:num('rc')}]})")+table(['Bon','Fournisseur','Date'],state.receipts.map(x=>[esc(x.reference),esc(x.supplier),esc(x.received_at)]))}
if(tab==='sorties'){v=form('Sortie validée par le magasinier','<label>Service</label><select id="service"><option value="cuisine">Cuisine</option><option value="asiatique">Asiatique</option><option value="brunch">Brunch</option><option value="comptoir">Comptoir / Bar</option></select><label>Article</label>'+sel(state.items,'si','name')+'<label>Quantité</label><input id="sq" type="number" step=".001" min=".001">',"post('issue',{service:val('service'),item_id:num('si'),quantity:num('sq')})")+table(['Service','Article','Quantité','Date'],state.issues.map(x=>[esc(x.service),esc(x.item),esc(x.quantity),esc(x.created_at)]))}
if(tab==='factures'){v=form('Enregistrer une facture fournisseur','<label>Fournisseur</label>'+sel(state.suppliers,'fs','name')+'<label>Référence facture</label><input id="fr"><label>Montant total (DA)</label><input id="fa" type="number" min="1">',"post('invoice',{supplier_id:num('fs'),reference:val('fr'),amount:num('fa')})")+table(['N°','Fournisseur','Facture','Montant','Solde'],state.invoices.map(x=>[x.id,esc(x.supplier),esc(x.reference),money(x.amount),money(x.due)]))}
if(tab==='demandes'){let available=state.invoices.filter(x=>x.due>0);v='<div class="card"><h2>Demande de paiement hebdomadaire</h2><p class="muted">Sélectionner les factures à soumettre. Les demandes sont archivées.</p>'+available.map(x=>'<label><input style="width:auto" type="checkbox" name="invoice" value="'+x.id+'"> '+esc(x.supplier)+' · '+esc(x.reference)+' · '+money(x.due)+'</label>').join('')+'<button onclick="submitRequest()">Soumettre la demande</button></div>'+table(['Demande','Auteur','Date','Statut','Actions'],state.requests.map(x=>[x.id,esc(x.author),esc(x.created_at),esc(x.status),role==='direction'&&x.status==='soumise'?'<button onclick="review('+x.id+',\'approuvee\')">Approuver</button><button class="secondary" onclick="review('+x.id+',\'refusee\')">Refuser</button>':'—']))+(role==='direction'?form('Confirmer un paiement réel','<label>Facture</label>'+sel(state.invoices.filter(x=>x.due>0),'pi','reference')+'<label>Montant réglé (DA)</label><input id="pa" type="number" min="1"><label>Mode</label><select id="pm"><option>Espèces</option><option>Virement</option><option>Chèque</option></select><label>Référence de paiement</label><input id="pr">',"post('payment',{invoice_id:num('pi'),amount:num('pa'),mode:val('pm'),reference:val('pr')})"):'')+'<button class="secondary" onclick="window.print()">Imprimer / enregistrer en PDF</button>'}
$('view').innerHTML=v;
}
function submitRequest(){post('request',{lines:[...document.querySelectorAll('input[name=invoice]:checked')].map(x=>Number(x.value))})}
function review(id,status){post('request/review',{request_id:id,status})}
</script></body></html>
