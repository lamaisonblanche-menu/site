<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Caisse La Maison Blanche</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f4f3f0;color:#111;font:16px/1.45 "Segoe UI",system-ui,sans-serif;user-select:none}
.w{padding:26px 34px}
img{width:120px;display:block;margin:0 auto 6px}
h1{font-weight:400;text-align:center;font-size:24px;margin:0 0 18px}
.c{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.o{background:#fff;border:2px solid #e2e0db;border-radius:16px;padding:18px;cursor:pointer;text-align:left;font:inherit}
.o b{display:block;font-size:19px;margin-bottom:6px}
.o span{color:#73716c;font-size:14px}
.o.on{border-color:#111;box-shadow:0 0 0 2px #111}
#poste{margin-top:18px;display:none}
.l{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.l button,.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid #d6d3cc;background:#fff;font:inherit;cursor:pointer}
.l button.on{background:#111;color:#fff;border-color:#111}
input{min-height:48px;border:1px solid #d6d3cc;border-radius:12px;padding:0 14px;font:inherit;width:220px}
.go{display:block;width:100%;margin-top:22px;min-height:58px;border-radius:14px;border:0;background:#111;color:#fff;font:inherit;font-size:18px;cursor:pointer}
.go:disabled{opacity:.3}
.m{color:#73716c;font-size:14px}
.err{color:#b3261e}
</style></head><body><div class="w">
<img src="logo.png" alt=""><h1>Ce PC sert à quoi ?</h1>
<div class="c">
  <button class="o" id="bp" onclick="choix('principale')"><b>Caisse principale</b><span>Le PC du comptoir avec le tiroir-caisse. Il garde toutes les ventes et commande les imprimantes. Un seul PC au restaurant.</span></button>
  <button class="o" id="bs" onclick="choix('poste')"><b>Écran de salle ou de cuisine</b><span>Les écrans des serveurs (gastro, brunch, terrasse) et l'écran cuisine. Ils se branchent sur la caisse principale.</span></button>
</div>
<div id="poste">
  <div class="m">Recherche de la caisse principale sur le réseau… <button class="btn" onclick="chercher()">Chercher encore</button></div>
  <div class="l" id="liste"></div>
  <div class="m">ou son adresse IP (affichée dans Gestion › Réglages sur la caisse principale) :</div>
  <div class="l"><input id="ip" placeholder="ex. 192.168.1.20" oninput="sel=this.value.trim();maj()"><button onclick="tester()">Tester</button></div>
  <div id="res" class="m"></div>
</div>
<button class="go" id="go" disabled onclick="valider()">Valider</button>
<p class="m" style="text-align:center">La caisse démarrera toute seule à chaque allumage du PC.</p>
</div>
<script>
let mode = '', sel = '';
const q = new URLSearchParams(location.search);
function choix(m) { mode = m; document.getElementById('bp').classList.toggle('on', m === 'principale'); document.getElementById('bs').classList.toggle('on', m === 'poste'); document.getElementById('poste').style.display = m === 'poste' ? 'block' : 'none'; if (m === 'poste') chercher(); maj(); }
function maj() { document.getElementById('go').disabled = !(mode === 'principale' || (mode === 'poste' && sel)); }
async function chercher() {
  const l = document.getElementById('liste'); l.innerHTML = '<span class="m">…</span>';
  const r = await caisseApp.decouvrir();
  l.innerHTML = r.length ? '' : '<span class="m err">Aucune caisse principale trouvée. Elle doit être allumée, avec l\'application ouverte.</span>';
  for (const x of r) { const b = document.createElement('button'); b.textContent = x.nom + ' (' + x.adresse + ')'; b.onclick = () => { sel = x.adresse; document.getElementById('ip').value = x.adresse; [...l.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); maj(); }; l.appendChild(b); }
  if (r.length === 1) l.firstChild.click();
}
async function tester() { const ok = await caisseApp.tester(sel); document.getElementById('res').innerHTML = ok ? '✓ Caisse principale trouvée' : '<span class="err">Pas de réponse à cette adresse</span>'; }
function valider() { caisseApp.choisir({ mode, adresse: sel }); }
if (q.get('mode')) { choix(q.get('mode')); if (q.get('adresse')) { sel = q.get('adresse'); document.getElementById('ip').value = sel; maj(); } }
</script></body></html>
