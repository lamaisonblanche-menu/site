<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Caisse La Maison Blanche</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font:18px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;user-select:none}
img{width:170px;filter:invert(1);display:block;margin:0 auto 26px}
.s{width:38px;height:38px;border:4px solid #444;border-top-color:#b8955a;border-radius:50%;margin:26px auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.m{color:#aaa;font-size:15px;max-width:560px}
button{margin-top:26px;background:none;border:1px solid #555;color:#ddd;border-radius:999px;padding:12px 22px;font:inherit;font-size:15px;cursor:pointer}
</style></head><body><div>
<img src="logo.png" alt="">
<div id="t">Démarrage de la caisse…</div><div class="s"></div>
<div class="m" id="m"></div>
<button onclick="caisseApp.reglages()">Réglages de ce PC</button> <button onclick="caisseApp.quitter()">Quitter</button>
</div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('mode') === 'poste') {
  document.getElementById('t').textContent = 'Connexion à la caisse principale…';
  document.getElementById('m').textContent = 'Adresse : ' + (q.get('adresse') || '?') + '. Vérifiez que le PC de la caisse principale est allumé et sur le même réseau. Cet écran se reconnecte tout seul.';
} else document.getElementById('m').textContent = 'Quelques secondes…';
</script></body></html>
