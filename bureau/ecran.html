<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Rapports La Maison Blanche</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.5 "Segoe UI", system-ui, sans-serif; background: #f4f3f0; color: #1d1d1b; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(720px, 92vw); background: #fff; border-radius: 14px; box-shadow: 0 6px 30px rgba(0,0,0,.08); padding: 36px 44px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  header img { width: 56px; height: 56px; object-fit: contain; }
  header p { margin: 0; color: #8a7f6c; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  header h1 { margin: 0; font-size: 22px; }
  h2 { font-size: 24px; margin: 0 0 10px; }
  .code { font-size: 64px; font-weight: 700; letter-spacing: .12em; text-align: center; margin: 18px 0; color: #1d1d1b; font-variant-numeric: tabular-nums; }
  ol { padding-left: 22px; } li { margin: 6px 0; }
  .chemin { background: #f4f3f0; border-radius: 6px; padding: 2px 8px; font-weight: 600; white-space: nowrap; }
  .note { color: #6b665c; font-size: 15px; }
  .alerte { background: #fff1ef; border-left: 4px solid #c0392b; padding: 10px 14px; border-radius: 6px; }
  .ok { background: #eef7ef; border-left: 4px solid #2e7d32; padding: 10px 14px; border-radius: 6px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
  button { font: inherit; padding: 11px 20px; border-radius: 8px; border: 1px solid #c9c3b6; background: #fff; cursor: pointer; }
  button.principal { background: #1d1d1b; color: #fff; border-color: #1d1d1b; }
  button:disabled { opacity: .5; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; font: 16px Consolas, monospace; padding: 10px 12px; border: 1px solid #c9c3b6; border-radius: 8px; }
  .roue { width: 38px; height: 38px; border: 4px solid #e4dfd4; border-top-color: #1d1d1b; border-radius: 50%; animation: t 1s linear infinite; margin: 18px auto; }
  @keyframes t { to { transform: rotate(360deg); } }
  .lien { background: none; border: 0; color: #6b665c; text-decoration: underline; padding: 0; }
</style>
<script defer src="ecran.js"></script>
</head>
<body>
<main>
  <header><img src="logo.png" alt=""><div><p>La Maison Blanche</p><h1>Rapports du bureau</h1></div></header>
  <section id="contenu" aria-live="polite"><div class="roue"></div></section>
</main>
</body>
</html>
